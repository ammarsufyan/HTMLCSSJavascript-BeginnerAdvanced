<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Semantic CSS</title>
    </head>
    <style>
        header {
            background-color: gray;
            padding: 30px;
            text-align: center;
            font-size: 35px;
            color: white;
        }
        article {
            padding: 20px;
            width: 100%;
            background-color: #f1f1f1;
        }
        footer {
            background-color: grey;
            padding: 10px;
            text-align: center;
            color: white;
        }
        nav {
            background-color: yellow;
            padding: 10px;
        }
        nav ul {
            list-style-type: none;
            overflow: hidden;
        }
        nav li {
            float: left;
        }
        nav li a {
            display: block;
            text-align: center;
            padding: 16px;
            text-decoration: none;
        }
        nav li a:hover {
            background-color: orange;
        }
    </style>
    <body>
        <header>
            <h1>Title</h1>
        </header>
        <nav>
            <ul>
                <li><a href="">Home</a></li>
                <li><a href="">Article</a></li>
                <li><a href="">Contact</a></li>
            </ul>
        </nav>
        <section>
            <article>
                <h1>Article 1</h1>
                <p>Paragraph 1</p>
            </article>
            <article>
                <h1>Article 2</h1>
                <p>Paragraph 2</p>
            </article>
        </section>
        <footer>
            <p>Created by Ammar Sufyan <time datetime="2026">2026</time></p>
        </footer>
    </body>
</html>
