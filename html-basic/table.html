<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Table</title>
    </head>
    <body>
        <h1>Table</h1>
        <table style="border: 1px solid black">
            <colgroup>
                <col span="2" style="background-color: yellow" />
                <col style="background-color: aqua" />
            </colgroup>
            <thead>
                <tr>
                    <th colspan="2">Name</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Ammar</td>
                    <td>Sufyan</td>
                    <td>100</td>
                </tr>
                <tr>
                    <td>Joko</td>
                    <td>Mulyono</td>
                    <td>60</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td rowspan="2">Summary</td>
                    <td>Total</td>
                    <td>190</td>
                </tr>
                <tr>
                    <td>Average</td>
                    <td>95</td>
                </tr>
            </tfoot>
        </table>
    </body>
</html>
