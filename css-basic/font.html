<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Font</title>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto" />
        <style>
            /* https://developer.mozilla.org/en-US/docs/Web/CSS/font */
            /* https://developer.mozilla.org/en-US/docs/Web/CSS/font-family */
            /* https://www.w3.org/TR/css-fonts-3/#generic-font-families */
            h1 {
                font-family: sans-serif;
            }
            /* https://developer.mozilla.org/en-US/docs/Web/CSS/font-style */
            /* https://developer.mozilla.org/en-US/docs/Web/CSS/font-weight */
            p[title="font-style"] {
                font-style: italic;
                font-weight: bold;
            }
            /* https://developer.mozilla.org/en-US/docs/Web/CSS/font-size */
            h2 {
                font-size: 40px;
            }
            /* https://fonts.google.com/ */
            h3 {
                font-family: "Roboto";
            }
        </style>
    </head>
    <body>
        <h1>Font CSS</h1>
        <p title="font-style">
            Lorem ipsum dolor sit amet consectetur, adipisicing elit. Consectetur officia architecto
            dolorum recusandae et adipisci in, quos possimus nemo, veniam quod omnis fugit facere?
            In corporis natus tenetur aliquam nihil.
        </p>
        <h2>Font Size Larger h2</h2>
        <h3>Roboto</h3>
    </body>
</html>
