<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Filter</title>
        <style>
            /* https://developer.mozilla.org/en-US/docs/Web/CSS/filter */
            img {
                height: 500px;
                width: 500px;
                filter: blur(5px);
            }
            p {
                filter: blur(5px);
            }
        </style>
    </head>
    <body>
        <img src="assets/wood.jpg" alt="" />
        <p>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Blanditiis sequi doloribus
            autem dolorem perferendis molestias error, ratione deleniti repellendus consequatur
            soluta perspiciatis odio modi maiores impedit, suscipit vitae voluptas ex.
        </p>
    </body>
</html>
