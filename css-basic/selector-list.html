<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>List Selector</title>
        <style>
            h1,
            h2,
            p,
            #another,
            .red {
                color: red;
            }
        </style>
    </head>
    <body>
        <h1>Title</h1>
        <h2>Sub Title</h2>
        <p>Description</p>

        <h3 id="another">Another</h3>
        <h4 class="red">One</h4>
    </body>
</html>
