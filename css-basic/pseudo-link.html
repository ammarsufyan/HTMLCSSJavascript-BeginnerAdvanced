<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pseudo - Link</title>
        <style>
            div {
                margin-top: 20px;
            }
            a {
                padding: 10px;
                font-family: sans-serif;
                text-decoration: none;
                border-style: solid;
                border-radius: 10px;
            }
            /* https://developer.mozilla.org/en-US/docs/Web/CSS/Pseudo-classes#user_action_pseudo-classes */
            /* https://developer.mozilla.org/en-US/docs/Web/CSS/Pseudo-classes#location_pseudo-classes */
            a:visited {
                color: green;
            }
            a:hover {
                color: white;
                background-color: yellowgreen;
            }
        </style>
    </head>
    <body>
        <div>
            <a href="https://ammarsufyan.com/">Portfolio</a>
            <a href="https://www.linkedin.com/in/ammarsufyan/">LinkedIn</a>
        </div>
    </body>
</html>
