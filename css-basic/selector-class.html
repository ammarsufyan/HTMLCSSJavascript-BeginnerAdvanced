<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Class Selector</title>
        <style>
            .red {
                color: red;
            }
            .upper {
                text-transform: uppercase;
            }
        </style>
    </head>
    <body>
        <h1 class="red upper">Title</h1>
        <h2 class="red upper">Sub Title</h2>
        <p class="red">Description</p>
    </body>
</html>
