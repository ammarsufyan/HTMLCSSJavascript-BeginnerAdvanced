<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>layer</title>
        <style>
            /* https://developer.mozilla.org/en-US/docs/Web/CSS/@layer */
            @layer b, a;

            @layer a {
                h1 {
                    color: red;
                }
            }

            @layer b {
                h1 {
                    color: green;
                }
            }
        </style>
    </head>
    <body>
        <h1>Heading 1</h1>
    </body>
</html>
