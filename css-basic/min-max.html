<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Min Max Size</title>
        <style>
            /* https://developer.mozilla.org/en-US/docs/Web/CSS/min-height */
            /* https://developer.mozilla.org/en-US/docs/Web/CSS/min-width */
            /* https://developer.mozilla.org/en-US/docs/Web/CSS/max-height */
            /* https://developer.mozilla.org/en-US/docs/Web/CSS/max-width */
            div {
                width: 75%;
                background-color: green;
                min-width: 200px;
                max-width: 500px;
                min-height: 200px;
                max-height: 500px;
            }
        </style>
    </head>
    <body>
        <div>
            <p>
                Lorem ipsum dolor sit, amet consectetur adipisicing elit. Mollitia qui suscipit
                delectus fugit magnam, ea incidunt ullam sed nisi nam culpa accusamus quo a
                repudiandae facilis ducimus quis quod. Temporibus.
            </p>
        </div>
    </body>
</html>
