<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Table</title>
        <style>
            /* https://developer.mozilla.org/en-US/docs/Web/CSS/border-collapse */
            table,
            tr,
            th,
            td,
            th {
                border-style: solid;
                border-width: 2px;
                border-collapse: collapse;
            }
            table {
                height: 200px;
                width: 200px;
                text-align: center;
            }
            tr:hover {
                background-color: yellowgreen;
            }
        </style>
    </head>
    <body>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Ammar</td>
                    <td>100</td>
                </tr>
                <tr>
                    <td>Joko</td>
                    <td>50</td>
                </tr>
                <tr>
                    <td>Prabo</td>
                    <td>11</td>
                </tr>
                <tr>
                    <td>Tedsky</td>
                    <td>10</td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
