<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cascade</title>
        <style>
            /* CASCADE ORDER
            1. User Agent/Browser Stylesheet (Chrome, Firefox, etc)
            2. Author Stylesheet (Tailwind, Bootstrap, etc) 
            3. User Stylesheet (Your own stylesheet)
            */

            /* Author Stylesheet */
            @import url(external.css);

            /* User Stylesheet */
            h1 {
                color: black;
            }
            /* In same stylesheet, the last order applied */
            h1 {
                color: green;
            }
            /* https://developer.mozilla.org/en-US/docs/Web/CSS/important */
            /* Add important so no one can change the property, the last important applied */
            /* Recommended to use layer than important */
            h1 {
                color: purple !important;
            }
            body {
                background-color: grey;
            }
        </style>
    </head>
    <body>
        <h1>Heading 1</h1>
        <h2>Heading 2</h2>
    </body>
</html>
