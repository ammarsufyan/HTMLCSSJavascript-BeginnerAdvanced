<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Range</title>
    </head>
    <body>
        <form>
            <label for="brightness">Brightness :</label>
            <input
                type="range"
                name="brightness"
                id="brightness"
                min="0"
                max="100"
                step="10"
                value="0"
            />
            <br />
            <input type="submit" value="Submit" />
        </form>
    </body>
</html>
