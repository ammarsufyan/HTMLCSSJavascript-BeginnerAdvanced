<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Time</title>
    </head>
    <body>
        <form>
            <label for="checkin">Checkin :</label>

        </form>
    </body>
